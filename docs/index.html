<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Budget</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --text: #f8fafc;
    --muted: #94a3b8;
    --green: #10b981;
    --red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 12px; }

  header { margin-bottom: 16px; }
  h1 { font-size: 1.25rem; }

  /* Summary Cards */
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .card { background: var(--card); padding: 10px; border-radius: 8px; text-align: center; }
  .card span { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .card strong { font-size: 0.95rem; }
  .income-val { color: var(--green); }
  .expense-val { color: var(--red); }

  /* Form */
  form { background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.9rem; }
  button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
  
  /* List */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--card); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .item-desc { font-weight: 500; }
  .item-sub { font-size: 0.75rem; color: var(--muted); }
  .item-right { display: flex; align-items: center; gap: 10px; }
  .delete-btn { background: none; border: none; color: var(--red); font-size: 1.2rem; padding: 0 4px; width: auto; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>💰 Mobile Budget Tracker</h1>
</header>

<div class="summary-grid">
  <div class="card">
    <span>Income</span>
    <strong class="income-val" id="summary-income">$0</strong>
  </div>
  <div class="card">
    <span>Spent</span>
    <strong class="expense-val" id="summary-spent">$0</strong>
  </div>
  <div class="card">
    <span>Balance</span>
    <strong id="summary-balance">$0</strong>
  </div>
</div>

<form id="entry-form">
  <input type="text" id="desc" placeholder="Description" required>
  <input type="number" id="amount" step="0.01" placeholder="Amount ($)" required>
  <select id="type">
    <option value="expense">Expense</option>
    <option value="income">Income</option>
  </select>
  <button type="submit">Add Transaction</button>
</form>

<div class="list" id="transaction-list"></div>

<script>
  let transactions = JSON.parse(localStorage.getItem('mobile_budget')) || [];

  const form = document.getElementById('entry-form');
  const list = document.getElementById('transaction-list');

  function update() {
    localStorage.setItem('mobile_budget', JSON.stringify(transactions));
    
    // Render Summary
    const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
    const spent = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
    const balance = income - spent;

    document.getElementById('summary-income').textContent = `$${income.toFixed(2)}`;
    document.getElementById('summary-spent').textContent = `$${spent.toFixed(2)}`;
    document.getElementById('summary-balance').textContent = `$${balance.toFixed(2)}`;

    // Render List
    list.innerHTML = '';
    transactions.slice().reverse().forEach((t) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div>
          <div class="item-desc">${t.desc}</div>
          <div class="item-sub">${t.type}</div>
        </div>
        <div class="item-right">
          <strong class="${t.type === 'income' ? 'income-val' : 'expense-val'}">
            ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}
          </strong>
          <button class="delete-btn" onclick="deleteTransaction(${t.id})">&times;</button>
        </div>
      `;
      list.appendChild(item);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const desc = document.getElementById('desc').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;

    transactions.push({ id: Date.now(), desc, amount, type });
    form.reset();
    update();
  });

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    update();
  }

  update();
</script>

</body>
</html>
