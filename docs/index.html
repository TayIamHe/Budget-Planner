<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monthly Budget Planner</title>
<style>
/* ══════════════════════════════════════════
   MOBILE-FIRST DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  --bg:            #0f172a;
  --bg-subtle:     #1e293b;
  --surface:       #1e293b;
  --surface-hover: #334155;
  --border:        rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.18);
  --accent:        #6366f1;
  --accent-light:  #818cf8;
  --accent-dim:    rgba(99, 102, 241, 0.18);
  --green:         #10b981;
  --green-dim:     rgba(16, 185, 129, 0.15);
  --red:           #ef4444;
  --red-dim:       rgba(239, 68, 68, 0.15);
  --amber:         #f59e0b;
  --amber-dim:     rgba(245, 158, 11, 0.15);
  --blue:          #3b82f6;
  --text:          #f8fafc;
  --text-muted:    #94a3b8;
  --text-dim:      #64748b;
  --radius:        12px;
  --radius-sm:     8px;
  --radius-lg:     18px;
  --shadow:        0 8px 30px rgba(0, 0, 0, 0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }
body { padding-bottom: 74px; /* Space for bottom nav */ }

/* ── PAGE VISIBILITY ── */
.page { display: none; padding: 12px; max-width: 800px; margin: 0 auto; }
.page.active { display: block; }

/* ══════════════════════════════════════════
   HEADER & TOP ACTIONS
══════════════════════════════════════════ */
#app-header {
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 300;
  backdrop-filter: blur(12px);
}
#app-header h1 { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }

.year-ctrl {
  display: flex;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 8px;
}
.year-ctrl span { font-weight: 700; font-size: 13px; min-width: 36px; text-align: center; color: var(--accent-light); }
.year-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; padding: 2px 6px; cursor: pointer; }

/* ── MONTH TAB SCROLLER ── */
#tab-bar {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  overflow-x: auto;
  padding: 8px 10px;
  gap: 6px;
  scrollbar-width: none;
}
#tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 600;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#new-month-btn {
  margin-left: auto;
  padding: 6px 10px;
  background: var(--red-dim);
  color: var(--red);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 20px;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}

/* ── DATA TOOLBAR ── */
#save-tools {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 12px 2px;
  scrollbar-width: none;
  max-width: 800px;
  margin: 0 auto;
}
#save-tools::-webkit-scrollbar { display: none; }
.autosave-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--green-dim); color: var(--green);
  border: 1px solid rgba(16,185,129,.3);
  border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
#save-tools button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
  border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 600; white-space: nowrap;
}

/* ══════════════════════════════════════════
   BOTTOM NAVIGATION BAR (MOBILE NATIVE STYLE)
══════════════════════════════════════════ */
#bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 60px; background: var(--bg-subtle);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 400; padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; color: var(--text-dim);
  font-size: 10px; font-weight: 700; flex: 1; padding: 6px 0;
}
.nav-item .icon { font-size: 18px; }
.nav-item.active { color: var(--accent-light); }

/* ══════════════════════════════════════════
   SUMMARY CARDS GRID
══════════════════════════════════════════ */
#summary-strip {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px; margin-bottom: 14px;
}
.sum-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; position: relative;
}
.sum-card.full { grid-column: 1 / -1; }
.s-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
.s-value { font-size: 18px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sum-card.income .s-value { color: var(--green); }
.sum-card.budgeted .s-value { color: var(--blue); }
.sum-card.expenses .s-value { color: var(--red); }
.sum-card.savings .s-value { color: var(--accent-light); }
.remaining-positive { color: var(--green) !important; }
.remaining-negative { color: var(--red) !important; }

/* ══════════════════════════════════════════
   CATEGORIES & ACCORDIONS
══════════════════════════════════════════ */
.section-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; background: rgba(255,255,255,0.02);
  cursor: pointer; user-select: none;
}
.section-header-left { display: flex; align-items: center; gap: 10px; flex: 1; }
.s-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  background: rgba(255,255,255,0.05);
}
.section-header h2 { font-size: 13px; font-weight: 700; color: var(--text); }
.cat-stats-summary { text-align: right; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cat-stats-summary .sub { display: block; font-size: 9px; color: var(--text-dim); text-transform: uppercase; }

.section-body { padding: 8px; border-top: 1px solid var(--border); display: none; }
.section-card.open .section-body { display: block; }

/* Category stats detailed row */
.cat-stats-bar {
  display: flex; justify-content: space-between;
  background: var(--bg); padding: 8px 10px; border-radius: var(--radius-sm);
  margin-bottom: 8px; font-size: 11px; font-weight: 700;
}
.stat-box { display: flex; flex-direction: column; align-items: center; }
.stat-lbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
.val-budget { color: var(--blue); }
.val-spent { color: var(--amber); }
.val-rem { color: var(--green); }
.val-over { color: var(--red); }

/* ══════════════════════════════════════════
   TOUCH-FRIENDLY BUDGET ROW
══════════════════════════════════════════ */
.budget-row {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px; margin-bottom: 6px;
  display: flex; flex-direction: column; gap: 6px;
}
.budget-row-top { display: flex; align-items: center; gap: 6px; }
.row-label {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-size: 15px; font-weight: 600; outline: none; padding: 4px;
}
.row-label::placeholder { color: var(--text-dim); }

.budget-row-bottom { display: flex; align-items: center; gap: 6px; }
.row-date, .row-amount, .recurrence-select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; border-radius: 6px; padding: 6px 8px; outline: none;
}
.row-date { width: 110px; color: var(--text-muted); font-size: 11px; }
.row-amount { flex: 1; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.recurrence-select { width: 85px; font-size: 11px; color: var(--text-muted); }

.del-btn {
  width: 32px; height: 32px; border: none; background: var(--red-dim);
  color: var(--red); font-size: 18px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.add-row-btn {
  width: 100%; padding: 10px; border: 1px dashed var(--border-strong);
  background: transparent; color: var(--accent-light); font-size: 13px;
  font-weight: 700; border-radius: var(--radius-sm); margin-top: 4px;
}

/* ══════════════════════════════════════════
   PAGE 2: SPENDING & CALENDAR
══════════════════════════════════════════ */
.dsp-card, .cal-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 14px;
}
.dsp-form { padding: 10px; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.1); }
.dsp-form input, .dsp-form select {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px; font-size: 14px; color: var(--text); outline: none;
}
.dsp-add-btn {
  background: var(--accent); color: #fff; border: none;
  padding: 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
}

.dsp-toolbar { padding: 8px 10px; display: flex; gap: 6px; background: var(--bg); border-bottom: 1px solid var(--border); }
.dsp-search { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; }
.dsp-filter-sel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px; color: var(--text-muted); font-size: 12px; }

.dsp-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px;
}
.dsp-row-left { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.dsp-desc { font-weight: 600; color: var(--text); }
.dsp-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
.dsp-cat-pill { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 10px; }
.dsp-amount { font-weight: 800; color: var(--amber); margin-right: 10px; font-variant-numeric: tabular-nums; }

/* ── CALENDAR MOBILE ── */
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-subtle); }
.cal-header h3 { font-size: 14px; font-weight: 700; }
.cal-nav-btn { background: none; border: none; color: var(--text); font-size: 20px; padding: 0 8px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 10px; font-weight: 800; color: var(--text-dim); padding: 6px 0; border-bottom: 1px solid var(--border); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 6px; background: var(--bg); }
.cal-cell {
  background: var(--surface); min-height: 48px; border-radius: 6px; padding: 2px 4px;
  display: flex; flex-direction: column; justify-content: space-between; position: relative;
}
.cal-cell.other-month { opacity: 0.3; }
.cal-cell.today { border: 1px solid var(--accent); }
.cal-cell.selected { background: var(--surface-hover); border: 1px solid #fff; }
.cal-day-num { font-size: 10px; font-weight: 700; color: var(--text-muted); text-align: right; }
.cal-dots { display: flex; gap: 2px; justify-content: center; margin-bottom: 2px; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.dot.bill { background: var(--red); }
.dot.spend { background: var(--amber); }

#cal-day-detail { padding: 12px; background: var(--bg-subtle); border-top: 1px solid var(--border); display: none; }
#cal-day-detail.open { display: block; }
.cal-detail-item { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }

/* MODAL */
#modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 999; align-items: center; justify-content: center; padding: 16px;
}
#modal-overlay.open { display: flex; }
#save-modal { background: var(--surface); padding: 20px; border-radius: var(--radius); width: 100%; max-width: 360px; }
#save-modal h3 { margin-bottom: 8px; }
#save-filename { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin: 12px 0; }
.modal-row { display: flex; gap: 8px; }
.modal-btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 700; }
.modal-btn.primary { background: var(--accent); color: #fff; }
.modal-btn.secondary { background: var(--bg); color: var(--text-muted); }
</style>
</head>
<body>

<!-- ══ SAVE MODAL ══ -->
<div id="modal-overlay">
  <div id="save-modal">
    <h3>💾 Save Backup</h3>
    <input id="save-filename" type="text" value="budget-backup.json">
    <div class="modal-row">
      <button class="modal-btn secondary" id="modal-cancel">Cancel</button>
      <button class="modal-btn primary" id="modal-confirm">Download</button>
    </div>
  </div>
</div>

<!-- ══ HEADER ══ -->
<header id="app-header">
  <h1>💰 Budget</h1>
  <div class="year-ctrl">
    <button class="year-btn" id="yr-prev">&#8249;</button>
    <span id="yr-display">2026</span>
    <button class="year-btn" id="yr-next">&#8250;</button>
  </div>
</header>

<!-- ══ MONTH TABS ══ -->
<div id="tab-bar">
  <button class="tab-btn" data-month="0">Jan</button>
  <button class="tab-btn" data-month="1">Feb</button>
  <button class="tab-btn" data-month="2">Mar</button>
  <button class="tab-btn" data-month="3">Apr</button>
  <button class="tab-btn" data-month="4">May</button>
  <button class="tab-btn" data-month="5">Jun</button>
  <button class="tab-btn" data-month="6">Jul</button>
  <button class="tab-btn" data-month="7">Aug</button>
  <button class="tab-btn" data-month="8">Sep</button>
  <button class="tab-btn" data-month="9">Oct</button>
  <button class="tab-btn" data-month="10">Nov</button>
  <button class="tab-btn" data-month="11">Dec</button>
  <button id="new-month-btn">↺ Reset</button>
</div>

<!-- ══ TOOLBAR ══ -->
<div id="save-tools">
  <span class="autosave-chip">✓ Saved</span>
  <button id="btn-save-now">Save</button>
  <button id="btn-save-as">Save As</button>
  <button id="btn-export">Export</button>
  <button id="btn-import">Import</button>
  <input id="import-file" type="file" accept="application/json" hidden>
</div>

<!-- ══ PAGE 1: BUDGET PLANNER ══ -->
<div id="budget-page" class="page active">
  <div id="summary-strip">
    <div class="sum-card income">
      <div class="s-label">Income</div>
      <div class="s-value" id="s-income">$0.00</div>
    </div>
    <div class="sum-card budgeted">
      <div class="s-label">Budgeted</div>
      <div class="s-value" id="s-budgeted">$0.00</div>
    </div>
    <div class="sum-card expenses">
      <div class="s-label">Expenses</div>
      <div class="s-value" id="s-expenses">$0.00</div>
    </div>
    <div class="sum-card savings">
      <div class="s-label">Savings Rate</div>
      <div class="s-value" id="s-rate">0.0%</div>
    </div>
    <div class="sum-card full remaining">
      <div class="s-label">Remaining Balance</div>
      <div class="s-value remaining-positive" id="s-remaining">$0.00</div>
    </div>
  </div>

  <div id="grid"></div>
</div>

<!-- ══ PAGE 2: SPENDING & CALENDAR ══ -->
<div id="spending-page" class="page">
  <div class="dsp-card">
    <div id="dsp-header-mount"></div>
    <div class="dsp-form" id="dsp-form-mount"></div>
    <div class="dsp-toolbar" id="dsp-toolbar-mount"></div>
    <div id="dsp-scroll"></div>
  </div>

  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
      <h3 id="cal-month-label">July 2026</h3>
      <button class="cal-nav-btn" id="cal-next">&#8250;</button>
    </div>
    <div class="cal-dow">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="cal-day-detail">
      <h4 id="cal-detail-title" style="font-size: 13px; font-weight:700; margin-bottom: 6px;">Detail</h4>
      <div id="cal-detail-items"></div>
    </div>
  </div>
</div>

<!-- ══ BOTTOM MOBILE NAVIGATION ══ -->
<nav id="bottom-nav">
  <button class="nav-item active" data-page="budget">
    <span class="icon">📋</span>
    <span>Budget</span>
  </button>
  <button class="nav-item" data-page="spending">
    <span class="icon">📅</span>
    <span>Tracker & Cal</span>
  </button>
</nav>

<script>
// ══════════════════════════════════════════════════════════════
//  CONSTANTS & DATA MODEL
// ══════════════════════════════════════════════════════════════
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const CATEGORIES = [
  { id:'income',         label:'Income',        icon:'💵', isIncome:true },
  { id:'savings',        label:'Savings',        icon:'🏦' },
  { id:'housing',        label:'Housing',        icon:'🏠' },
  { id:'utilities',      label:'Utilities',      icon:'⚡' },
  { id:'food',           label:'Food',           icon:'🍽️' },
  { id:'transportation', label:'Transportation', icon:'🚗' },
  { id:'wellness',       label:'Wellness',       icon:'💪' },
  { id:'personal',       label:'Personal',       icon:'🛍️' },
  { id:'insurance',      label:'Insurance',      icon:'🛡️' },
  { id:'family',         label:'Family',         icon:'👨‍👩‍👧' },
  { id:'home',           label:'Home',           icon:'🔧' },
  { id:'subscriptions',  label:'Subscriptions',  icon:'📱' },
  { id:'loans',          label:'Loans',          icon:'💳' },
  { id:'other',          label:'Other',          icon:'📦' },
];
const ALL_EXPENSE_CATS = CATEGORIES.filter(c => !c.isIncome);

const DEFAULT_ROWS = {
  income:         [['Paycheck 1',''],['Paycheck 2',''],['Additional Income','']],
  savings:        [['Emergency Fund',''],['Retirement (401k)',''],['Other Savings','']],
  housing:        [['Rent / Mortgage',''],['HOA Fees',''],["Renter's Insurance",'']],
  utilities:      [['Electric & Gas',''],['Water & Sewer',''],['Cell Phone',''],['Internet','']],
  food:           [['Groceries',''],['Restaurants','']],
  transportation: [['Car Insurance',''],['Gas',''],['Car Payment','']],
  wellness:       [['Gym Membership',''],['Medications','']],
  personal:       [['Clothing',''],['Fun Money','']],
  insurance:      [['Health Insurance',''],['Life Insurance','']],
  family:         [['Childcare',''],['Education','']],
  home:           [['Repairs',''],['Supplies','']],
  subscriptions:  [['Streaming',''],['Cloud Storage','']],
  loans:          [['Car Loan',''],['Credit Card','']],
  other:          [['Miscellaneous','']],
};

const RECUR_OPTS = [
  {v:'one-time',l:'Once'},{v:'weekly',l:'Wkly'},
  {v:'biweekly',l:'Bi-wk'},{v:'monthly',l:'Mthly'},
  {v:'quarterly',l:'Qtrly'},{v:'yearly',l:'Yrly'},
];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let currentPage = 'budget';
let calYear = currentYear;
let calMonth = currentMonth;
let selectedDay = null;

const SK = (y,m) => `budget_v3_${y}_${m}`;
const DSK = (y,m) => `dsp_v3_${y}_${m}`;

function loadMonthData(y,m) {
  try { const r=localStorage.getItem(SK(y,m)); if(r) return JSON.parse(r); } catch(e) {}
  const d={};
  CATEGORIES.forEach(c => { d[c.id]=(DEFAULT_ROWS[c.id]||[]).map(r=>({label:r[0],amount:'',date:'',recurrence:'one-time'})); });
  return d;
}
function saveMonthData(y,m,data) { try{localStorage.setItem(SK(y,m),JSON.stringify(data));}catch(e){} }
function loadSpending(y,m) {
  try { const r=localStorage.getItem(DSK(y,m)); if(r) return JSON.parse(r); } catch(e) {}
  return [];
}
function saveSpending(y,m,entries) { try{localStorage.setItem(DSK(y,m),JSON.stringify(entries));}catch(e){} }

const fmt = n => '$'+(isNaN(+n)?0:+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => isNaN(n)?'0.0%':(n*100).toFixed(1)+'%';
const parseAmt = v => { const n=parseFloat(String(v||0).replace(/[$,]/g,'')); return isNaN(n)?0:n; };
const todayISO = () => new Date().toISOString().slice(0,10);

function el(tag, cls) { const e = document.createElement(tag); if(cls) e.className = cls; return e; }

// ══════════════════════════════════════════════════════════════
//  RENDER BUDGET PAGE
// ══════════════════════════════════════════════════════════════
function render() {
  const data = loadMonthData(currentYear, currentMonth);
  const spending = loadSpending(currentYear, currentMonth);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Render Income Card (always open)
  grid.appendChild(buildCategoryCard(CATEGORIES[0], data, spending, true));

  // Render Expense Accordion Cards
  ALL_EXPENSE_CATS.forEach(cat => {
    grid.appendChild(buildCategoryCard(cat, data, spending, false));
  });

  updateSummary(data, spending);
  if (currentPage === 'spending') renderSpending();
}

function buildCategoryCard(cat, data, spending, defaultOpen) {
  const rows = data[cat.id] || [];
  const budgeted = rows.reduce((s,r) => s + parseAmt(r.amount), 0);
  const spent = spending.filter(e => e.cat === cat.id).reduce((s,e) => s + parseAmt(e.amount), 0);
  const remaining = budgeted - spent;

  const card = el('div', `section-card ${defaultOpen ? 'open' : ''}`);
  card.dataset.cat = cat.id;

  const header = el('div', 'section-header');
  header.onclick = () => card.classList.toggle('open');

  header.innerHTML = `
    <div class="section-header-left">
      <div class="s-icon">${cat.icon}</div>
      <h2>${cat.label}</h2>
    </div>
    <div class="cat-stats-summary">
      <div>${fmt(cat.isIncome ? budgeted : remaining)}</div>
      <span class="sub">${cat.isIncome ? 'Total' : (remaining < 0 ? 'Over' : 'Remaining')}</span>
    </div>
  `;
  card.appendChild(header);

  const body = el('div', 'section-body');

  if (!cat.isIncome) {
    const statsBar = el('div', 'cat-stats-bar');
    statsBar.innerHTML = `
      <div class="stat-box"><span class="stat-lbl">Budget</span><span class="val-budget">${fmt(budgeted)}</span></div>
      <div class="stat-box"><span class="stat-lbl">Spent</span><span class="val-spent">${fmt(spent)}</span></div>
      <div class="stat-box"><span class="stat-lbl">Left</span><span class="${remaining < 0 ? 'val-over' : 'val-rem'}">${fmt(remaining)}</span></div>
    `;
    body.appendChild(statsBar);
  }

  rows.forEach((row, idx) => {
    body.appendChild(buildMobileBudgetRow(cat.id, idx, row));
  });

  const addBtn = el('button', 'add-row-btn');
  addBtn.textContent = '+ Add Item';
  addBtn.onclick = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (!d[cat.id]) d[cat.id] = [];
    d[cat.id].push({label:'', amount:'', date:'', recurrence:'one-time'});
    saveMonthData(currentYear, currentMonth, d);
    render();
  };
  body.appendChild(addBtn);

  card.appendChild(body);
  return card;
}

function buildMobileBudgetRow(catId, idx, rowData) {
  const row = el('div', 'budget-row');

  // Top Line: Description
  const top = el('div', 'budget-row-top');
  const lbl = el('input', 'row-label');
  lbl.type = 'text'; lbl.value = rowData.label || ''; lbl.placeholder = 'Item name';
  lbl.onchange = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (d[catId]?.[idx]) d[catId][idx].label = lbl.value;
    saveMonthData(currentYear, currentMonth, d);
  };
  top.appendChild(lbl);

  // Bottom Line: Date, Amount, Recurrence, Delete
  const bottom = el('div', 'budget-row-bottom');

  const di = el('input', 'row-date');
  di.type = 'date'; di.value = rowData.date || '';
  di.onchange = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (d[catId]?.[idx]) d[catId][idx].date = di.value;
    saveMonthData(currentYear, currentMonth, d);
  };

  const ai = el('input', 'row-amount');
  ai.type = 'number'; ai.step = '0.01'; ai.value = rowData.amount || ''; ai.placeholder = '0.00';
  ai.oninput = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (d[catId]?.[idx]) d[catId][idx].amount = ai.value;
    saveMonthData(currentYear, currentMonth, d);
    updateSummary(d, loadSpending(currentYear, currentMonth));
  };

  const rs = el('select', 'recurrence-select');
  RECUR_OPTS.forEach(o => {
    const op = document.createElement('option');
    op.value = o.v; op.textContent = o.l;
    if ((rowData.recurrence || 'one-time') === o.v) op.selected = true;
    rs.appendChild(op);
  });
  rs.onchange = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (d[catId]?.[idx]) d[catId][idx].recurrence = rs.value;
    saveMonthData(currentYear, currentMonth, d);
  };

  const del = el('button', 'del-btn');
  del.innerHTML = '×';
  del.onclick = () => {
    const d = loadMonthData(currentYear, currentMonth);
    if (d[catId]) d[catId].splice(idx, 1);
    saveMonthData(currentYear, currentMonth, d);
    render();
  };

  bottom.appendChild(di);
  bottom.appendChild(ai);
  bottom.appendChild(rs);
  bottom.appendChild(del);

  row.appendChild(top);
  row.appendChild(bottom);
  return row;
}

function updateSummary(data, spending) {
  const income = (data['income'] || []).reduce((s,r) => s + parseAmt(r.amount), 0);
  const savings = (data['savings'] || []).reduce((s,r) => s + parseAmt(r.amount), 0);
  const budgeted = ALL_EXPENSE_CATS.reduce((s, cat) => s + (data[cat.id]||[]).reduce((sub, r) => sub + parseAmt(r.amount), 0), 0);
  const trackerSpent = spending.reduce((s,e) => s + parseAmt(e.amount), 0);

  const totalExpenses = budgeted + trackerSpent;
  const remain = income - totalExpenses;

  document.getElementById('s-income').textContent = fmt(income);
  document.getElementById('s-budgeted').textContent = fmt(budgeted);
  document.getElementById('s-expenses').textContent = fmt(totalExpenses);
  document.getElementById('s-remaining').textContent = fmt(remain);
  document.getElementById('s-rate').textContent = pct(income > 0 ? savings / income : 0);

  const re = document.getElementById('s-remaining');
  re.classList.toggle('remaining-positive', remain >= 0);
  re.classList.toggle('remaining-negative', remain < 0);
}

// ══════════════════════════════════════════════════════════════
//  SPENDING TRACKER & CALENDAR
// ══════════════════════════════════════════════════════════════
function renderSpending() {
  const spending = loadSpending(currentYear, currentMonth);
  buildDspForm();
  buildDspList(spending);
  renderCalendar();
}

function buildDspForm() {
  const fm = document.getElementById('dsp-form-mount');
  fm.innerHTML = `
    <input type="date" id="dsp-date" value="${todayISO()}">
    <input type="text" id="dsp-desc" placeholder="Expense description">
    <select id="dsp-cat">
      <option value="">Category</option>
      ${ALL_EXPENSE_CATS.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('')}
    </select>
    <input type="number" id="dsp-amt" step="0.01" placeholder="Amount ($)">
    <button class="dsp-add-btn" onclick="logExpense()">+ Add Expense</button>
  `;

  const hm = document.getElementById('dsp-header-mount');
  hm.innerHTML = `<div style="padding:10px 14px; font-weight:800; font-size:14px; border-bottom:1px solid var(--border)">📝 Daily Log</div>`;

  const tb = document.getElementById('dsp-toolbar-mount');
  tb.innerHTML = `
    <input type="text" id="dsp-search" class="dsp-search" placeholder="Search..." oninput="filterSpending()">
    <select id="dsp-cat-filter" class="dsp-filter-sel" onchange="filterSpending()">
      <option value="">All Cats</option>
      ${ALL_EXPENSE_CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join('')}
    </select>
  `;
}

function logExpense() {
  const desc = document.getElementById('dsp-desc').value.trim();
  const amt = document.getElementById('dsp-amt').value;
  const cat = document.getElementById('dsp-cat').value;
  const date = document.getElementById('dsp-date').value || todayISO();

  if (!desc || !amt) return;
  const entries = loadSpending(currentYear, currentMonth);
  entries.push({ id: Date.now(), date, desc, cat, amount: amt });
  saveSpending(currentYear, currentMonth, entries);

  renderSpending();
  render();
}

function filterSpending() {
  const q = document.getElementById('dsp-search').value.toLowerCase();
  const catF = document.getElementById('dsp-cat-filter').value;
  let entries = loadSpending(currentYear, currentMonth);

  if (q) entries = entries.filter(e => e.desc.toLowerCase().includes(q));
  if (catF) entries = entries.filter(e => e.cat === catF);

  buildDspList(entries);
}

function buildDspList(entries) {
  const scroll = document.getElementById('dsp-scroll');
  scroll.innerHTML = '';

  if (!entries.length) {
    scroll.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-dim); font-size:12px;">No logged expenses.</div>`;
    return;
  }

  entries.slice().reverse().forEach(entry => {
    const catObj = CATEGORIES.find(c => c.id === entry.cat);
    const row = el('div', 'dsp-row');
    row.innerHTML = `
      <div class="dsp-row-left">
        <span class="dsp-desc">${entry.desc}</span>
        <span class="dsp-meta">
          <span>${entry.date}</span>
          ${catObj ? `<span class="dsp-cat-pill">${catObj.icon} ${catObj.label}</span>` : ''}
        </span>
      </div>
      <span class="dsp-amount">${fmt(entry.amount)}</span>
      <button class="del-btn" onclick="deleteSpend(${entry.id})">×</button>
    `;
    scroll.appendChild(row);
  });
}

function deleteSpend(id) {
  let entries = loadSpending(currentYear, currentMonth);
  entries = entries.filter(e => e.id !== id);
  saveSpending(currentYear, currentMonth, entries);
  renderSpending();
  render();
}

function renderCalendar() {
  const data = loadMonthData(currentYear, currentMonth);
  const spending = loadSpending(currentYear, currentMonth);

  document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth]} ${calYear}`;

  const billsByDate = {};
  ALL_EXPENSE_CATS.forEach(cat => {
    (data[cat.id] || []).forEach(row => {
      if (row.date && row.amount) {
        if (!billsByDate[row.date]) billsByDate[row.date] = [];
        billsByDate[row.date].push({ label: row.label || cat.label, amount: parseAmt(row.amount) });
      }
    });
  });

  const spendByDate = {};
  spending.forEach(e => {
    if (e.date) {
      if (!spendByDate[e.date]) spendByDate[e.date] = [];
      spendByDate[e.date].push(e);
    }
  });

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  for (let i = 0; i < 35; i++) {
    let day, month = calMonth, year = calYear, otherMonth = false;
    if (i < firstDay) {
      day = daysInPrev - firstDay + i + 1;
      month = calMonth - 1; if (month < 0) { month = 11; year--; }
      otherMonth = true;
    } else if (i - firstDay >= daysInMonth) {
      day = i - firstDay - daysInMonth + 1;
      month = calMonth + 1; if (month > 11) { month = 0; year++; }
      otherMonth = true;
    } else {
      day = i - firstDay + 1;
    }

    const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const cell = el('div', `cal-cell ${otherMonth ? 'other-month' : ''} ${iso === todayISO() ? 'today' : ''}`);

    const dn = el('span', 'cal-day-num'); dn.textContent = day;
    cell.appendChild(dn);

    const dots = el('div', 'cal-dots');
    if (billsByDate[iso]) dots.appendChild(el('span', 'dot bill'));
    if (spendByDate[iso]) dots.appendChild(el('span', 'dot spend'));
    cell.appendChild(dots);

    cell.onclick = () => {
      document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      const detail = document.getElementById('cal-day-detail');
      const items = document.getElementById('cal-detail-items');
      items.innerHTML = '';
      
      const bList = billsByDate[iso] || [];
      const sList = spendByDate[iso] || [];

      if (!bList.length && !sList.length) {
        items.innerHTML = '<div style="font-size:11px; color:var(--text-dim);">No items for this date</div>';
      } else {
        bList.forEach(b => {
          items.innerHTML += `<div class="cal-detail-item"><span>💸 ${b.label}</span><strong>${fmt(b.amount)}</strong></div>`;
        });
        sList.forEach(s => {
          items.innerHTML += `<div class="cal-detail-item"><span>🛒 ${s.desc}</span><strong>${fmt(s.amount)}</strong></div>`;
        });
      }
      detail.classList.add('open');
    };

    grid.appendChild(cell);
  }
}

// ══════════════════════════════════════════════════════════════
//  NAVIGATION & DATA MANAGEMENT
// ══════════════════════════════════════════════════════════════
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.onclick = () => {
    currentPage = btn.dataset.page;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('budget-page').classList.toggle('active', currentPage === 'budget');
    document.getElementById('spending-page').classList.toggle('active', currentPage === 'spending');
    if (currentPage === 'budget') render();
    if (currentPage === 'spending') renderSpending();
  };
});

function setYear(y) { currentYear = y; calYear = y; document.getElementById('yr-display').textContent = y; render(); }
function setMonth(m) {
  currentMonth = m; calMonth = m;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === m));
  render();
}

document.getElementById('yr-prev').onclick = () => setYear(currentYear - 1);
document.getElementById('yr-next').onclick = () => setYear(currentYear + 1);
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => setMonth(parseInt(btn.dataset.month));
});

document.getElementById('cal-prev').onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
document.getElementById('cal-next').onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };

document.getElementById('new-month-btn').onclick = () => {
  if (!confirm(`Reset data for ${MONTHS[currentMonth]} ${currentYear}?`)) return;
  const fresh = {};
  CATEGORIES.forEach(c => { fresh[c.id] = (DEFAULT_ROWS[c.id]||[]).map(r => ({label:r[0], amount:'', date:'', recurrence:'one-time'})); });
  saveMonthData(currentYear, currentMonth, fresh);
  saveSpending(currentYear, currentMonth, []);
  render();
};

function getAllData() {
  const saved = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('budget_v3_') || k.startsWith('dsp_v3_')) {
      try { saved[k] = JSON.parse(localStorage.getItem(k)); } catch(e){}
    }
  }
  return saved;
}

function downloadJSON(filename, data) {
  const blob = new Blob([JSON.stringify({app:'Mobile Budget Planner', exportedAt: new Date().toISOString(), data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename; a.click();
}

document.getElementById('btn-save-now').onclick = () => alert('Data is automatically saved to LocalStorage!');
document.getElementById('btn-save-as').onclick = () => document.getElementById('modal-overlay').classList.add('open');
document.getElementById('modal-cancel').onclick = () => document.getElementById('modal-overlay').classList.remove('open');
document.getElementById('modal-confirm').onclick = () => {
  const name = document.getElementById('save-filename').value || 'budget.json';
  downloadJSON(name, getAllData());
  document.getElementById('modal-overlay').classList.remove('open');
};
document.getElementById('btn-export').onclick = () => downloadJSON(`budget-${todayISO()}.json`, getAllData());
document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();
document.getElementById('import-file').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const records = parsed.data || parsed;
      Object.entries(records).forEach(([k, v]) => {
        if (k.startsWith('budget_v3_') || k.startsWith('dsp_v3_')) localStorage.setItem(k, JSON.stringify(v));
      });
      render();
    } catch(err) { alert('Invalid backup file'); }
  };
  reader.readAsText(file);
};

// INIT
document.getElementById('yr-display').textContent = currentYear;
document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === currentMonth));
render();
</script>
</body>
</html>
